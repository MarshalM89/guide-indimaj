site_name: "Guide d'utilisation INDIM@J"
site_description: "Installation du poste, renouvellement du certificat, double authentification (MFA) et dépannage pour INDIM@J"
site_url: https://marshalm89.github.io/guide-indimaj/

nav:
  - Accueil: index.md
  - Installation du poste:
      - Introduction: installation/index.md
      - "Phase 1 — Navigateurs": installation/navigateurs/index.md
      - "Phase 2 — Certificat": installation/certificat/index.md
      - "Phase 3 — Java": installation/java/index.md
      - "Phase 4 — Finalisation de Firefox": installation/finalisation-firefox/index.md
      - Vérification finale: installation/verification/index.md
  - Renouvellement du certificat: renouvellement/index.md
  - Double authentification (MFA):
      - Présentation: mfa/index.md
      - "Étape 1 — Installer l'application": mfa/installer/index.md
      - "Étapes 2 et 3 — Activation": mfa/activation/index.md
      - Se connecter au quotidien: mfa/connexion/index.md
      - En cas de problème: mfa/assistance/index.md
      - Questions fréquentes: mfa/faq/index.md
  - Dépannage: depannage/index.md

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/langue.js

# Bouton de langue (en haut de page) : la version arabe est publiée dans /ar/
extra:
  alternate:
    - name: Français
      link: ./
      lang: fr
    - name: العربية
      link: ./ar/
      lang: ar

theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  language: fr
  features:
    - content.code.copy
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - search.highlight
  palette:
    # Thème automatique : suit le réglage clair / sombre du système
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Passer en mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Suivre le thème du système

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: fr
  - glightbox
